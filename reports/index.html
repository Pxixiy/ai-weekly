<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI 前沿周报 · 往期</title>
<style>
:root{--bg:#f4f6f9;--surface:#fff;--text:#12161f;--text-2:#3c4655;--muted:#6b7686;--line:#e4e8ef;--accent:#2457e6;--accent-2:#e9efff;--maxw:900px}
@media (prefers-color-scheme:dark){:root{--bg:#0c0f14;--surface:#141922;--text:#e8ecf3;--text-2:#c3cbd8;--muted:#8b96a6;--line:#232b38;--accent:#6d8cff;--accent-2:#1a2340}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.75}
a{color:inherit;text-decoration:none}
.hero{padding:54px 24px 46px;color:#eef2ff;background:radial-gradient(900px 420px at 15% -10%,#1d4ed8 0%,transparent 55%),linear-gradient(160deg,#0b1220,#111a2e 60%,#0f172a)}
.hero-inner{max-width:var(--maxw);margin:0 auto}
.kicker{font-size:12px;letter-spacing:.12em;color:#9fb0d0}
h1{font-size:44px;line-height:1.1;margin:10px 0 8px;letter-spacing:-.03em}
.sub{margin:0;color:#b9c8e6;font-size:15px}
main{max-width:var(--maxw);margin:0 auto;padding:34px 24px 70px}
.list{display:grid;gap:14px}
.issue{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;transition:transform .18s ease,box-shadow .18s ease}
.issue:hover{transform:translateY(-2px);box-shadow:0 12px 30px -14px rgba(16,24,40,.25)}
.no{font-size:13px;font-weight:800;color:var(--accent)}
.date{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.lead{margin:8px 0 10px;color:var(--text-2);font-size:14.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.meta{font-size:12px;color:var(--muted)}
.open{font-size:13px;font-weight:600;color:var(--accent)}
.empty{color:var(--muted);font-size:14px}
.foot{max-width:var(--maxw);margin:0 auto;padding:0 24px 40px;font-size:11.5px;color:var(--muted)}
@media (max-width:640px){h1{font-size:34px}.issue{padding:18px 16px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner">
  <div class="kicker">AI 前沿周报 · ARCHIVE</div>
  <h1>往期归档</h1>
  <p class="sub">共 1 期 · 更新于 2026.11.17</p>
</div></header>
<main>
  <div class="list">
    <a class="issue" href="2026-11-09.html">
  <div class="no">第 1 期</div>
  <div class="date">2026.11.09 — 11.15</div>
  <p class="lead">本周主线是“智能体治理落地”与“身份/授权分层”：国内从倡议进入准入，海外从命名走向授权；前沿模型继续降价、走向可编排。</p>
  <div class="row">
    <span class="meta">12 条动态 · 5 条研判 · 4 条政策 · 7 项标准/日历</span>
    <span class="open">打开 →</span>
  </div>
</a>
  </div>
</main>
<footer class="foot">AI 前沿周报 · 往期归档 · 点击任意一期打开单文件 HTML</footer>
</body>
</html>
